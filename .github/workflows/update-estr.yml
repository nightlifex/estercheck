name: Update €STR data

on:
  schedule:
    # ECB publishes €STR at 08:00 Central European time on TARGET business days.
    # 07:30 UTC is after publication in both CET and CEST.
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-estr-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate data processing
        run: npm test

      - name: Fetch official ECB data
        run: npm run update-data

      - name: Commit successful data check
        shell: bash
        run: |
          if git diff --quiet -- data/estr.json; then
            echo "The successful check metadata is already current; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/estr.json
          git commit -m "chore(data): record successful €STR check"
          git push
